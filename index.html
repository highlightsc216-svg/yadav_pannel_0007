<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Access Portal</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0c20;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Background Balloons */
        .balloon {
            position: absolute;
            width: 30px;
            height: 40px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            bottom: -100px;
            opacity: 0.15;
            animation: floatUp 12s linear infinite;
            z-index: 0;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); bottom: -100px; }
            100% { transform: translateY(-120vh) rotate(360deg); bottom: 100%; }
        }

        /* Centered Glassmorphism Card Container */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 10;
        }

        .welcome-gradient {
            background: linear-gradient(45deg, #00ffcc, #ff007f, #9b51e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Form Input Field Styling */
        .input-group {
            margin-bottom: 22px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: #ff007f;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #00ffcc;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
        }

        /* Login Action Button Layout */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(45deg, #00ffcc, #00b4db);
            border: none;
            border-radius: 8px;
            color: #0f0c20;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            margin-top: 10px;
            margin-bottom: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 204, 0.5);
        }

        /* Footer Copyright Block */
        .credits {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
            line-height: 1.6;
        }

        .creator-gradient {
            background: linear-gradient(45deg, #00ffcc, #00f0ff, #ff007f, #ffbe0b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            animation: textShine 3s linear infinite;
            text-decoration: none;
        }

        @keyframes textShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Animated Background Layer Elements -->
    <div id="balloon-container"></div>

    <!-- MAIN ACCESS GATE CARD -->
    <div class="login-card">
        <h1 class="welcome-gradient">Secure Login</h1>
        <p class="subtitle">Enter credentials to open your client workstation</p>
        
        <form onsubmit="verifySimulationAccess(event)">
            <div class="input-group">
                <label for="username">Username / Email ID</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Type account user token..." required>
                </div>
            </div>

            <div class="input-group">
                <label for="password">Account Security Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Type personal key phrase..." required>
                </div>
            </div>

            <button type="submit"><i class="fas fa-sign-in-alt"></i> Authenticate Account</button>
        </form>

        <div class="credits">
            Designed & Maintained By: <br>
            <a href="https://instagram.com" target="_blank" class="creator-gradient">@piyush_gupta_701</a> & 
            <a href="https://instagram.com" target="_blank" class="creator-gradient">@its_rajeshyadav_0007</a>
        </div>
    </div>

    <script>
        // Runtime visual asset initialization loops
        function generateAmbientBalloons() {
            const containerNode = document.getElementById('balloon-container');
            const visualColors = ['#ff007f', '#7928ca', '#00ffcc', '#ffbe0b', '#00c6ff'];
            
            for(let i = 0; i < 12; i++) {
                const balloonInstance = document.createElement('div');
                balloonInstance.classList.add('balloon');
                
                balloonInstance.style.left = Math.random() * 100 + 'vw';
                balloonInstance.style.animationDelay = Math.random() * 6 + 's';
                balloonInstance.style.animationDuration = 7 + Math.random() * 8 + 's';
                balloonInstance.style.background = visualColors[Math.floor(Math.random() * visualColors.length)];
                
                containerNode.appendChild(balloonInstance);
            }
        }

        // Handle simulation alert validation triggers
        function verifySimulationAccess(eventContext) {
            eventContext.preventDefault();
            const userFieldValue = document.getElementById('username').value;
            
            alert(`Authentication Request Logged!\nUser: ${userFieldValue}\n\nConnection established successfully.`);
        }

        // Mount setup lifecycle bindings
        window.addEventListener('DOMContentLoaded', () => {
            generateAmbientBalloons();
        });
    </script>
</body>
</html>
